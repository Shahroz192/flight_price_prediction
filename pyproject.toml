dependencies = [
    "pandas>=2.3.1",
    "scikit-learn>=1.7.1",
    "xgboost>=3.0.2",
    "category-encoders>=2.8.1",
    "feature-engine>=1.8.3",
    "joblib>=1.5.1",
    "fastapi>=0.116.1",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.3",
    "mlflow>=3.1.1",
    "scikit-optimize>=0.10.2",
    "pytest>=8.4.1",
    "httpx>=0.28.1",
    "pip>=25.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
